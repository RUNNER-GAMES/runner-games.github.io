<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runner</title>
<meta name="description" content="Runner: free browser arcade games. Racing, swimming, running, hunting, zombies, rock and roll, traffic and hordes. One free account works in every game.">

<style>
:root{
  --bg:#0f111a; --bg2:#151829; --card:#1b1f33; --line:#2c3150; --ink:#f3f4fa; --muted:#a3a8c3;
  --accent:#ff8a2a; --accent2:#7dffe0;
  --pixel:"Press Start 2P", "Pixelify Sans", monospace; --pix2:"Pixelify Sans", "Courier New", monospace; --body:Inter, system-ui, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);line-height:1.5;
  background:radial-gradient(circle at 12% -5%, #2a1e3a 0, transparent 40%), radial-gradient(circle at 92% 10%, #10303a 0, transparent 38%), var(--bg)}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{padding:48px 0 28px;text-align:center}
.logo{font-family:var(--pixel);font-size:clamp(34px, 9vw, 64px);letter-spacing:4px;margin:0;color:var(--accent);
  text-shadow:0 4px 0 #8a3e0a, 0 8px 18px rgba(0,0,0,.5)}
.tag{font-family:var(--pix2);font-size:clamp(16px, 3.6vw, 21px);color:var(--muted);margin:16px 0 0}
.perks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0 0;padding:0;list-style:none}
.perks li{font-size:14px;color:#d8dbef;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.perks b{color:var(--accent2);font-weight:600}
main{padding:12px 0 40px}
.grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:20px;max-width:1000px;margin:0 auto}
@media (max-width:860px){ .grid{grid-template-columns:repeat(2, 1fr)} }
.game{display:flex;flex-direction:column;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease}
.game:hover,.game:focus-visible{transform:translateY(-3px);border-color:var(--c, var(--accent));box-shadow:0 10px 28px rgba(0,0,0,.45)}
.game:focus-visible{outline:3px solid var(--c, var(--accent));outline-offset:2px}
.thumb{position:relative;aspect-ratio:1/1;background:#0b0c14}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;image-rendering:auto}
.badge{position:absolute;top:10px;left:10px;font-family:var(--pixel);font-size:9px;letter-spacing:1px;background:var(--accent2);color:#0b1a18;padding:6px 8px;border-radius:6px}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h2{margin:0;font-family:var(--pix2);font-weight:700;font-size:23px;line-height:1.15;color:var(--c, var(--ink))}
.info p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.kind{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#7c82a6}
.play{margin-top:8px;align-self:flex-start;font-family:var(--pixel);font-size:11px;letter-spacing:1px;background:var(--c, var(--accent));color:#10121c;padding:10px 14px;border-radius:8px;border-bottom:3px solid rgba(0,0,0,.35)}
footer{border-top:1px solid var(--line);padding:22px 0 34px;text-align:center;color:#7c82a6;font-size:13.5px}
@media (max-width:560px){
  header{padding:34px 0 20px}
  .grid{gap:12px}
  .info{padding:10px 11px 12px}
  .info h2{font-size:18px}
  .info p{font-size:13px}
  .kind{font-size:10.5px}
  .play{font-size:9px;padding:8px 10px}
  .perks li{font-size:13px}
}
@media (prefers-reduced-motion: reduce){ .game{transition:none} .game:hover{transform:none} }
</style>
</head>
<body>
<header class="wrap">
  <h1 class="logo">RUNNER</h1>
  <p class="tag">Free arcade games. Play right in your browser.</p>
  <ul class="perks">
    <li><b>Free</b> on phone or computer</li>
    <li>One free account works in <b>every game</b></li>
    <li>New <b>daily leaderboards</b> at midnight</li>
  </ul>
</header>
<main class="wrap">
  <div class="grid" id="grid"></div>
</main>
<footer class="wrap">Runner · free browser games</footer>
